<style>
  /* ============================================================
     1. TOKENS
     ============================================================ */
  :root {
    color-scheme: light dark;
    --bg:      light-dark(#ebebeb, #121212);
    --ink:     light-dark(#111111, #f2f2f2);
    --muted:   light-dark(#7d7d7d, #8a8a8a);
    --rule:    light-dark(#b0b0b0, #555555);
    --surface: light-dark(#e0e0e0, #1e1e1e);

    --sun:      light-dark(#e8a800, #ffcc33);
    --sun-glow: light-dark(rgba(232, 168, 0, 0.0), rgba(255, 204, 51, 0.45));

    --font-serif:  'Instrument Serif', 'Times New Roman', serif;
    --font-script: 'Great Vibes', cursive;
    --font-mono:   'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    --font-pixel:  'Silkscreen', monospace;
    --font-sans:   'General Sans', 'Helvetica Neue', Arial, sans-serif;

    --gutter: clamp(1rem, 1.5vw, 1.5rem);
    --cols: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr) auto;
    --row-pad: 10px;

    --fs-hero:  clamp(2.4rem, 3.5vw, 5rem);
    --fs-desc:  clamp(1.35rem, 2vw, 2.225rem);
    --fs-body:  0.9375rem;
    --fs-meta:  0.875rem;
    --fs-nav:   0.8rem;
    --fs-label: 0.6875rem;

    --pixel-scale: 0.9;

    --ease-out:    cubic-bezier(.16, 1, .3, 1);
    --ease-stage2: cubic-bezier(.7, 0, .13, 1);
    --ease-row:    cubic-bezier(.33, 1, .68, 1);
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"]  { color-scheme: dark;  }

  /* ============================================================
     2. RESET + BASE
     ============================================================ */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  @media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
  html.lenis { scroll-behavior: auto !important; }
  html.lenis, html.lenis body { height: auto; }
  .lenis.lenis-smooth [data-lenis-prevent] { overscroll-behavior: contain; }
  .lenis.lenis-stopped { overflow: hidden; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 16px;
    line-height: 1.3;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }
  img { display: block; max-width: 100%; height: auto; }
  a { color: inherit; }
  button { font: inherit; color: inherit; }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
  .skip {
    position: absolute; left: 1rem; top: -3rem; z-index: 100;
    padding: .5rem .75rem; background: var(--ink); color: var(--bg);
    font-family: var(--font-mono); font-size: var(--fs-nav);
    text-decoration: none; transition: top .2s;
  }
  .skip:focus { top: 1rem; }
  :focus-visible { outline: 1px solid currentColor; outline-offset: .15em; }

  /* ============================================================
     3. FIXED NAV
     ============================================================ */
  .nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    display: flex; justify-content: flex-end; align-items: center;
    padding: var(--gutter);
    mix-blend-mode: difference;
    color: #fff;
    pointer-events: none;
    gap: 1.5em;
  }
  .nav > * { pointer-events: auto; }
  .nav__links {
    display: flex; gap: 1.5em; margin: 0; padding: 0; list-style: none;
    font-family: var(--font-mono);
    font-size: var(--fs-nav);
    letter-spacing: .02em;
  }
  .nav__links a {
    font-family: var(--font-mono);
    font-size: var(--fs-nav);
    letter-spacing: .02em;
    text-decoration: none;
    color: inherit;
  }
  .nav__links a:hover {
    text-decoration: underline;
    text-underline-offset: .2em;
    text-decoration-thickness: 1px;
  }

  /* ============================================================
     4. HERO
     ============================================================ */
  .hero {
    position: sticky; top: 0; z-index: 0;
    height: 100svh;
    display: grid; place-items: center;
    padding-bottom: 10svh;
    background: var(--bg);
    overflow: hidden;
  }
  .hero__center {
    position: relative;
    z-index: 1;
    width: min(49vw, 58rem);
    padding: 2rem;
    text-align: center;
  }
  .hero__title {
    margin: 0;
    font-family: var(--font-serif);
    font-size: var(--fs-hero);
    font-weight: 400;
    line-height: 1;
    letter-spacing: -.015em;
    text-transform: uppercase;
  }
  .hero__title .script {
    font-family: var(--font-script);
    font-size: 1.22em;
    text-transform: none;
    letter-spacing: 0;
  }
  .hero__title .pixel-line {
    font-family: var(--font-pixel);
    font-size: calc(1em * var(--pixel-scale));
    letter-spacing: 0;
    text-transform: uppercase;
    line-height: 1.15;
    display: inline-block;
    vertical-align: middle;
  }

  .line--location { padding-block: 0.2em; }
  .hero__location { font-size: 0.82em; }

  .hero__meta {
    position: absolute; bottom: 10svh; margin: 0;
    display: grid; row-gap: .3em;
    font-family: var(--font-mono);
    font-size: var(--fs-meta);
    line-height: 1.2; letter-spacing: .02em;
    color: var(--muted);
  }
  .hero__meta--left  { left: var(--gutter); }
  .hero__meta--right { right: var(--gutter); text-align: right; }

  .line { display: block; overflow: hidden; clip-path: inset(0); isolation: isolate; }
  .line__inner {
    display: block;
    transform: translateY(150%);
    transition: transform 1s var(--ease-out);
    text-box: trim-both cap alphabetic;
    will-change: transform;
  }
  .line.is-in .line__inner { transform: none; }

  .sun-toggle {
    display: inline-block;
    background: none;
    border: 0;
    padding: 0;
    margin: 0 0 0 0.35em;
    font-family: 'Segoe UI Symbol', 'Apple Symbols', 'Noto Sans Symbols', system-ui, sans-serif;
    font-size: 0.95em;
    line-height: 1;
    vertical-align: 0.05em;
    color: var(--sun);
    cursor: pointer;
    letter-spacing: 0;
    transition: rotate 1.2s var(--ease-stage2), filter .3s;
    will-change: rotate;
    text-shadow: 0 0 0.4em var(--sun-glow);
  }
  .sun-toggle:hover { rotate: 180deg; filter: brightness(1.1); }
  .sun-toggle:active { filter: brightness(0.95); }

  /* ============================================================
     5. CURSOR TRAIL GRID — HERO
     ============================================================ */
  .hero__grid {
    position: absolute; inset: 0;
    z-index: 2;
    display: none;
    pointer-events: none;
    mix-blend-mode: difference;
  }
  @media (hover: hover) and (width >= 800px) {
    .hero__grid { display: grid; grid-template-columns: repeat(20, 1fr); }
  }
  .hero__grid > div {
    aspect-ratio: 1;
    background-color: rgba(255, 255, 255, 0);
  }

  /* ============================================================
     6. PROJECTS
     ============================================================ */
  .projects {
    position: relative; z-index: 1;
    padding: 0 var(--gutter) 4rem;
    background: var(--bg);
  }
  .projects__head {
    display: grid; grid-template-columns: var(--cols);
    padding-bottom: 8px;
    border-bottom: 1.5px solid var(--rule);
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    letter-spacing: .02em; text-transform: uppercase;
    color: var(--muted);
  }
  .projects__head span:last-child { text-align: right; }

  .project {
    position: relative;
    border-bottom: 1.5px solid transparent;
  }
  .project::after {
    content: ''; position: absolute; left: 0; bottom: 0;
    width: 100%; height: 1.5px;
    background: var(--rule);
    transform: scaleX(0); transform-origin: left;
    transition: transform 1.5s var(--ease-out) .2s;
  }
  .project.is-in::after { transform: scaleX(1); }

  /* Row — container for the sliding fill */
  .project__row {
    position: relative;
    isolation: isolate;
    overflow: hidden;
    display: grid; grid-template-columns: var(--cols);
    width: 100%; padding: var(--row-pad) 0;
    background: none; border: 0; text-align: left;
    font-size: var(--fs-body); color: var(--ink);
    cursor: pointer;
  }

  /* Sliding fill — position is driven by --from, animated by CSS transition */
  .project__bg {
    position: absolute; inset: 0; z-index: 0;
    background: var(--ink);
    transform: translateY(var(--from, -100%));
    display: none;
  }

  .project__cell {
    position: relative; z-index: 1;
    transition: color .2s, padding .3s;
  }
  .project__year { text-align: right; }

  .project__badge {
    display: inline-block; margin-left: .6em;
    padding: .05em .45em;
    border: 1px solid var(--muted); border-radius: 2px;
    font-family: var(--font-mono);
    font-size: .58rem; letter-spacing: .06em; text-transform: uppercase;
    color: var(--muted);
    vertical-align: middle;
    transition: color .2s, border-color .2s;
  }

  /* The direction-aware sliding fill only exists on hover-capable pointers */
  @media (hover: hover) {
    .project__bg { display: block; }

    /* Enable the transform transition only while entering or leaving */
    .project__row.is-hovering .project__bg,
    .project__row.is-leaving .project__bg {
      transition: transform .25s var(--ease-row);
    }

    /* Fill fully covers the row */
    .project__row.is-hovering .project__bg {
      transform: translateY(0);
    }

    /* Text and badge invert to maintain contrast over the fill */
    .project__row.is-hovering .project__cell { color: var(--bg); }
    .project__row.is-hovering .project__cell:first-of-type { padding-left: .9rem; }
    .project__row.is-hovering .project__year { padding-right: .9rem; }
    .project__row.is-hovering .project__badge {
      color: var(--bg); border-color: var(--bg);
    }
  }

  /* Accordion */
  .project__body {
    display: grid; grid-template-rows: 0fr;
    transition: grid-template-rows .5s var(--ease-row);
  }
  .project.is-open .project__body { grid-template-rows: 1fr; }
  .project__inner { min-height: 0; overflow: hidden; }

  .project__desc {
    max-width: 32em; margin: 0; padding-top: 1em;
    font-size: var(--fs-desc); line-height: 1.25; letter-spacing: -.01em;
  }
  .project__link {
    display: inline-block; margin-top: 1em;
    font-size: var(--fs-body); text-decoration: underline;
    text-underline-offset: .15em;
  }
  .project__link:hover { text-decoration-thickness: 2px; }

  .project__images {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: var(--gutter); padding: 3rem 0 2rem;
    align-items: start;
  }
  .project__images img { width: 100%; background: var(--surface); }

  /* ============================================================
     7. FOOTER
     ============================================================ */
  .footer {
    padding: 3rem var(--gutter);
    border-top: 1.5px solid var(--rule);
    background: var(--bg);
    position: relative; z-index: 1;
  }
  .footer__meta {
    margin: 0;
    font-family: var(--font-mono);
    font-size: var(--fs-meta);
    color: var(--muted);
  }

  /* ============================================================
     8. RESPONSIVE
     ============================================================ */
  @media (width <= 760px) {
    :root {
      --fs-hero: clamp(1.5rem, 7.4vw, 2.4rem);
      --cols: minmax(0, 1fr) auto;
    }
    .hero { place-items: unset; grid-template-rows: 1fr auto; }
    .hero__center { width: 100%; padding: 3rem .75rem; align-self: center; }
    .hero__meta { bottom: var(--gutter); }
    .hero__meta--left, .hero__meta--right { bottom: var(--gutter); }
    .projects__head { grid-template-columns: minmax(0,1fr) auto; }
    .projects__head .wide,
    .project__cell.wide { display: none; }
    .project__row { grid-template-columns: minmax(0,1fr) auto; }
    .project__images { grid-template-columns: 1fr; }
    .project__desc { font-size: 1.35rem; }
  }

  /* ============================================================
     9. REDUCED MOTION
     ============================================================ */
  @media (prefers-reduced-motion: reduce) {
    .line__inner { transform: none !important; transition: none !important; }
    .project__bg, .project__cell, .project__body, .project::after,
    .sun-toggle, .project__badge { transition: none !important; }
    .project::after { transform: scaleX(1) !important; }
    .hero__grid { display: none !important; }
  }
</style>
</head>

<script>
/* ================================================================

const PROJECTS = [
  { title: "Personal Portfolio", category: "Design, Development", client: "Self-initiated concept", year: "2026", concept: true, description: "A concept exploration of editorial minimalism — large serif typography, hairline rules, and purposeful motion, built to showcase creative development work without visual noise.", url: null, images: [] },
  { title: "Athlete Portfolio", category: "Design, Development", client: "Concept project", year: "2026", concept: true, description: "A concept portfolio for a professional athlete — stats, timeline, and media laid out as a quiet editorial document rather than a highlight reel.", url: null, images: [] },
  { title: "Fashion Brand Website", category: "Web design, Development", client: "Concept project", year: "2025", concept: true, description: "A concept storefront for an independent fashion label, using a strict typographic grid and full-bleed imagery to let the garments carry the page.", url: null, images: [] },
  { title: "Architecture Studio Website", category: "Web design, Development", client: "Concept project", year: "2025", concept: true, description: "A concept site for an architecture practice — project index as a table, generous whitespace, and slow image reveals that mirror the pace of the work itself.", url: null, images: [] },
  { title: "SaaS Landing Page", category: "Design, Development", client: "Concept project", year: "2025", concept: true, description: "A concept landing page for a B2B product, built around a single strong statement and a short, honest feature list — no carousels, no gradients.", url: null, images: [] },
  { title: "E-commerce Website", category: "Development", client: "Concept project", year: "2024", concept: true, description: "A concept commerce experience focused on speed and clarity — a browsable catalogue, a calm product page, and a checkout that gets out of the way.", url: null, images: [] },
  { title: "Creative Agency Website", category: "Design, Development", client: "Concept project", year: "2024", concept: true, description: "A concept site for a small creative studio, structured as an editorial index of work with a single, confident voice throughout.", url: null, images: [] },
  { title: "Interactive Web Experience", category: "Development", client: "Concept project", year: "2024", concept: true, description: "A concept experiment in scroll-driven narrative and cursor interaction — motion used to guide attention, never to decorate.", url: null, images: [] }
];

/* ================================================================
   LENIS
   ================================================================ */
const prefersReduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let lenis = null;
if (!prefersReduced && typeof window.Lenis !== 'undefined') {
  lenis = new Lenis({
    duration: 1.15,
    easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
    smoothWheel: true,
  });
  (function raf(time){ lenis.raf(time); requestAnimationFrame(raf); })(0);
  window.lenis = lenis;
}
function smoothScrollTo(target, opts = {}) {
  if (!target) return;
  if (lenis) lenis.scrollTo(target, { offset: 0, duration: 1.2, ...opts });
  else target.scrollIntoView({ behavior: prefersReduced ? 'auto' : 'smooth', block: 'start' });
}
document.querySelectorAll('a[href^="#"]').forEach((a) => {
  a.addEventListener('click', (e) => {
    const id = a.getAttribute('href');
    if (!id || id === '#') return;
    const target = document.querySelector(id);
    if (!target) return;
    e.preventDefault();
    smoothScrollTo(target, { offset: -10 });
  });
});

/* ================================================================
   THEME
   ================================================================ */
(function theme() {
  const root = document.documentElement;
  const suns = Array.from(document.querySelectorAll('[data-sun]'));
  if (!suns.length) return;

  const FILLED_SUN = '\u2600\uFE0E';
  const OUTLINE_SUN = '\u263C\uFE0E';

  function current() {
    if (root.dataset.theme === 'dark') return 'dark';
    if (root.dataset.theme === 'light') return 'light';
    return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  function apply(theme) {
    root.dataset.theme = theme;
    try { localStorage.setItem('theme', theme); } catch (e) {}
    suns.forEach((s) => {
      s.textContent = theme === 'dark' ? FILLED_SUN : OUTLINE_SUN;
      s.setAttribute('aria-label', theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
    });
    const bg = getComputedStyle(document.body).backgroundColor;
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', bg);
  }
  apply(current());

  suns.forEach((btn) => {
    btn.addEventListener('click', () => {
      apply(current() === 'dark' ? 'light' : 'dark');
      if (!prefersReduced) {
        btn.animate(
          [{ transform: 'rotate(0deg)' }, { transform: 'rotate(360deg)' }],
          { duration: 700, easing: 'cubic-bezier(.7,0,.13,1)' }
        );
      }
    });
  });

  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (!root.dataset.theme) apply(current());
  });
})();

/* ================================================================
   HERO: mask-reveal intro
   ================================================================ */
(function intro() {
  const lines = document.querySelectorAll('#hero .line');
  if (prefersReduced) { lines.forEach((l) => l.classList.add('is-in')); return; }
  requestAnimationFrame(() => {
    lines.forEach((l, i) => setTimeout(() => l.classList.add('is-in'), 400 + i * 90));
  });
})();

/* ================================================================
   HERO: scroll fade
   ================================================================ */
(function fade() {
  const hero = document.getElementById('hero');
  if (!hero) return;
  let ticking = false;
  function update() {
    const p = Math.min(1, window.scrollY / (window.innerHeight * 0.5));
    hero.style.opacity = String(1 - p);
    hero.style.visibility = p >= 1 ? 'hidden' : 'visible';
    ticking = false;
  }
  window.addEventListener('scroll', () => {
    if (!ticking) { requestAnimationFrame(update); ticking = true; }
  }, { passive: true });
  update();
})();

/* ================================================================
   HERO: cursor trail grid
   ================================================================ */
(function cursorTrail() {
  const hero = document.getElementById('hero');
  const el = document.getElementById('grid');
  if (!hero || !el) return;
  if (prefersReduced) return;
  if (!matchMedia('(hover: hover) and (width >= 800px)').matches) return;

  const COLS = 20;
  const DURATION = 600;
  const HOLD_FRACTION = 0.12;
  const EASING = 'cubic-bezier(.16, 1, .3, 1)';

  let cellSize = 0;
  let rows = 0;
  let lastX = null;
  let lastY = null;
  const cellAnims = new WeakMap();

  const KEYFRAMES = [
    { backgroundColor: 'rgba(255,255,255,1)', offset: 0, easing: 'linear' },
    { backgroundColor: 'rgba(255,255,255,1)', offset: HOLD_FRACTION, easing: EASING },
    { backgroundColor: 'rgba(255,255,255,0)', offset: 1 },
  ];

  function build() {
    el.innerHTML = '';
    const w = el.clientWidth || window.innerWidth;
    const h = el.clientHeight || window.innerHeight;
    cellSize = w / COLS;
    rows = Math.ceil(h / cellSize);
    const frag = document.createDocumentFragment();
    for (let i = 0; i < COLS * rows; i++) frag.appendChild(document.createElement('div'));
    el.appendChild(frag);
    lastX = null;
    lastY = null;
  }
  build();

  let rt;
  window.addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(build, 150);
  });

  function cellAt(x, y) {
    if (x < 0 || x >= COLS || y < 0 || y >= rows) return null;
    return el.children[y * COLS + x] || null;
  }

  function lightCell(cell) {
    let anim = cellAnims.get(cell);
    if (!anim) {
      anim = cell.animate(KEYFRAMES, { duration: DURATION, fill: 'none' });
      cellAnims.set(cell, anim);
    } else {
      anim.cancel();
      anim.play();
    }
  }

  hero.addEventListener('pointermove', (e) => {
    if (hero.style.visibility === 'hidden') {
      lastX = null;
      lastY = null;
      return;
    }
    const rect = el.getBoundingClientRect();
    if (rect.width === 0) return;
    const cx = Math.floor((e.clientX - rect.left) / cellSize);
    const cy = Math.floor((e.clientY - rect.top) / cellSize);

    if (lastX === null) {
      const c = cellAt(cx, cy);
      if (c) lightCell(c);
    } else {
      const dx = cx - lastX;
      const dy = cy - lastY;
      const steps = Math.max(Math.abs(dx), Math.abs(dy));
      if (steps > 0) {
        const limit = Math.min(steps, COLS + rows);
        for (let i = 0; i <= limit; i++) {
          const t = i / limit;
          const x = Math.round(lastX + dx * t);
          const y = Math.round(lastY + dy * t);
          const cell = cellAt(x, y);
          if (cell) lightCell(cell);
        }
      }
    }
    lastX = cx;
    lastY = cy;
  });

  hero.addEventListener('pointerleave', () => {
    lastX = null;
    lastY = null;
  });
})();

/* ================================================================
   PROJECTS: render
   ================================================================ */
(function renderProjects() {
  const list = document.getElementById('projectList');
  if (!list) return;
  const frag = document.createDocumentFragment();
  PROJECTS.forEach((p, i) => {
    const article = document.createElement('article');
    article.className = 'project';
    article.dataset.project = '';
    article.dataset.index = String(i);
    const badge = p.concept ? '<span class="project__badge">Concept</span>' : '';
    const link = p.url ? `<a class="project__link" href="${p.url}" target="_blank" rel="noopener noreferrer">See website ↗</a>` : '';
    const images = (p.images && p.images.length)
      ? `<div class="project__images">${p.images.map(src => `<img src="${src}" alt="" loading="lazy" width="800" height="600" />`).join('')}</div>`
      : '';
    article.innerHTML = `
      <button class="project__row" type="button" aria-expanded="false" aria-controls="body-${i}">
        <span class="project__bg" aria-hidden="true"></span>
        <span class="project__cell"><span class="project__text">${p.title}</span>${badge}</span>
        <span class="project__cell wide"><span class="project__text">${p.category}</span></span>
        <span class="project__cell wide"><span class="project__text">${p.client}</span></span>
        <span class="project__cell project__year"><span class="project__text">${p.year}</span></span>
      </button>
      <div class="project__body" id="body-${i}" inert>
        <div class="project__inner">
          <p class="project__desc">${p.description}</p>
          ${link}
          ${images}
        </div>
      </div>
    `;
    frag.appendChild(article);
  });
  list.appendChild(frag);
})();

/* ================================================================
   PROJECTS: direction-aware sliding fill (the "vanishing traces")
   ----------------------------------------------------------------
   On mouseenter:
     - Set --from to the side the cursor entered from
     - Force reflow so the bg jumps to that side (no transition)
     - Add .is-hovering → CSS transition slides bg to 0

   On mouseleave:
     - Set --from to the side the cursor exited toward
     - Swap .is-hovering for .is-leaving → CSS transition slides
       bg to the exit side
     - Remove .is-leaving after the transition completes

   Because each row is fully independent, sweeping across the
   list leaves a trail of partially-filled rows behind the cursor.
   ================================================================ */
(function rowHoverTrail() {
  if (!matchMedia('(hover: hover)').matches) return;
  if (prefersReduced) return;

  document.querySelectorAll('[data-project]').forEach((p) => {
    const row = p.querySelector('.project__row');
    const bg = p.querySelector('.project__bg');
    if (!row || !bg) return;

    let leaveTimer;

    row.addEventListener('mouseenter', (e) => {
      clearTimeout(leaveTimer);
      const r = row.getBoundingClientRect();
      const fromTop = e.clientY < r.top + r.height / 2;
      bg.style.setProperty('--from', fromTop ? '-100%' : '100%');
      // Force reflow so the bg commits to the new --from side BEFORE
      // we add .is-hovering. Without this, the transition would start
      // from wherever the bg was last left (opposite side on re-entry).
      void bg.offsetWidth;
      row.classList.remove('is-leaving');
      row.classList.add('is-hovering');
    });

    row.addEventListener('mouseleave', (e) => {
      const r = row.getBoundingClientRect();
      const toTop = e.clientY < r.top + r.height / 2;
      bg.style.setProperty('--from', toTop ? '-100%' : '100%');
      row.classList.remove('is-hovering');
      row.classList.add('is-leaving');
      clearTimeout(leaveTimer);
      leaveTimer = setTimeout(() => row.classList.remove('is-leaving'), 260);
    });

    // Keyboard: show the same full fill when the row is focused
    row.addEventListener('focus', () => {
      clearTimeout(leaveTimer);
      bg.style.setProperty('--from', '-100%');
      void bg.offsetWidth;
      row.classList.remove('is-leaving');
      row.classList.add('is-hovering');
    });
    row.addEventListener('blur', () => {
      bg.style.setProperty('--from', '100%');
      row.classList.remove('is-hovering');
      row.classList.add('is-leaving');
      clearTimeout(leaveTimer);
      leaveTimer = setTimeout(() => row.classList.remove('is-leaving'), 260);
    });
  });
})();

/* ================================================================
   PROJECTS: accordion
   ================================================================ */
(function accordion() {
  const projects = Array.from(document.querySelectorAll('[data-project]'));
  let openIdx = null;
  function close(p) {
    p.classList.remove('is-open');
    p.querySelector('.project__row').setAttribute('aria-expanded', 'false');
    p.querySelector('.project__body').setAttribute('inert', '');
  }
  function open(p) {
    p.classList.add('is-open');
    p.querySelector('.project__row').setAttribute('aria-expanded', 'true');
    p.querySelector('.project__body').removeAttribute('inert');
  }
  projects.forEach((p, i) => {
    p.querySelector('.project__row').addEventListener('click', () => {
      if (openIdx === i) { close(p); openIdx = null; return; }
      if (openIdx !== null) close(projects[openIdx]);
      open(p); openIdx = i;
      if (window.innerWidth < 800) {
        setTimeout(() => smoothScrollTo(p, { offset: -72, duration: 1 }), 300);
      }
    });
  });
})();

/* ================================================================
   PROJECTS: separator reveal
   ================================================================ */
(function separators() {
  const items = document.querySelectorAll('[data-project]');
  if (prefersReduced || !('IntersectionObserver' in window)) {
    items.forEach((p) => p.classList.add('is-in'));
    return;
  }
  const io = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) {
        entry.target.classList.add('is-in');
        io.unobserve(entry.target);
      }
    });
  }, { rootMargin: '0px 0px -10% 0px' });
  items.forEach((p) => io.observe(p));
})();
</script>
